<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gcm Admin</title>
    <link rel="stylesheet" href="vendor/element-plus.css">
    <link rel="stylesheet" href="vendor/quill.snow.css">
    <link rel="stylesheet" href="vendor/quill-resize.css">
    <link rel="stylesheet" href="css/main.less" type="text/less">
    <script src="vendor/vue.global.prod.js"></script>
    <script src="vendor/vue3-sfc-loader.js"></script>
    <script src="vendor/vue-router.global.prod.js"></script>
    <script src="vendor/element-plus.full.min.js"></script>
    <script src="vendor/element-plus-icons-vue.js"></script>
    <script src="vendor/element-plus-zh-cn.js"></script>
    <script src="vendor/quill.js"></script>
    <script src="vendor/quill-resize.js"></script>
    <script src="vendor/less.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/panel.js"></script>
</head>
<body>
    <div id="panel-app"></div>

    <script>
        window.AppConfig = {
            defaultPage: 'dashboard',
            menu: [
                { key: 'nodes', label: '内容管理', icon: 'Document', route: 'nodes' },
                { key: 'settings', label: '站点配置', icon: 'Setting', route: 'settings' },
                { key: 'account', label: '账号', icon: 'User', route: 'account' },
            ],
        }
        Panel.createApp({
            root: 'pages/App.vue',
            routes: [
                { name: 'nodes', path: '/', url: 'pages/nodes.vue' },
                { name: 'tree', path: '/tree/:type', url: 'pages/tree.vue' },
                { name: 'settings', path: '/settings', url: 'pages/settings.vue' },
                { name: 'account', path: '/account', url: 'pages/account.vue' },
            ],
        })
    </script>
</body>
</html>
